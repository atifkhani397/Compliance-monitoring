# MACMS Configuration - Meridian Global Bank
# Environment variable overrides: MCMS_<SECTION>_<KEY> (e.g., MCMS_KAFKA_BOOTSTRAP_SERVERS)

agents:
  agent-tm-001:
    name: "Transaction Monitor"
    secret_key: "tm-secret-key-2026"
    resource_limits:
      vcpu: 32
      memory_gb: 128
  agent-cs-001:
    name: "Communication Scanner"
    secret_key: "cs-secret-key-2026"
    resource_limits:
      vcpu: 24
      memory_gb: 96
  agent-ru-001:
    name: "Regulatory Update Tracker"
    secret_key: "ru-secret-key-2026"
    resource_limits:
      vcpu: 8
      memory_gb: 32
  agent-rg-001:
    name: "Report Generator"
    secret_key: "rg-secret-key-2026"
    resource_limits:
      vcpu: 16
      memory_gb: 64

kafka:
  bootstrap_servers:
    - "localhost:9092"
  producer:
    batch_size: 16384
    linger_ms: 5
    compression_type: "gzip"
    acks: "all"
    retries: 3
    max_in_flight_requests_per_connection: 5
  consumer:
    group_id: "mcms-consumer-group"
    auto_offset_reset: "earliest"
    enable_auto_commit: false

audit:
  storage_path: "./data/audit"
  initial_seed: "MERIDIAN_GENESIS_BLOCK"
  retention_days: 2555

orchestrator:
  max_queue_depth: 1000
  max_retries: 3
  heartbeat_interval_seconds: 30
  shutdown_timeout_seconds: 30

consensus:
  prior: 0.5
  escalation_threshold: 0.7
  convergence_threshold: 0.2
  agent_weights:
    agent-tm-001: 0.35
    agent-cs-001: 0.30
    agent-ru-001: 0.20
    agent-rg-001: 0.15

# Phase 4 human-in-the-loop escalation configuration
escalation:
  human_queue_topic: "mcms.escalation.human"
  default_tier: "TIER_1"
  sla_seconds:
    TIER_1: 14400
    TIER_2: 7200
    TIER_3: 3600
    TIER_4: 1800
  after_hours: false
  review_warning_fraction: 0.5

human_assignment:
  business_hours_start: 6
  business_hours_end: 18
  on_call: []
  cco_id: "cco-001"

feedback:
  review_period_seconds: 86400
  thresholds: {}
  agent_weights:
    agent-tm-001: 0.35
    agent-cs-001: 0.30
    agent-ru-001: 0.20
    agent-rg-001: 0.15

# Phase 5 observability configuration
observability:
  log_path: "data/observability/audit.jsonl"
  initial_seed: "MERIDIAN_GENESIS_BLOCK"
  default_key: "macms-phase5-development-key"
  metrics:
    retention_seconds: 31536000
    ema_alpha: 0.3
    trend_stability_tolerance: 0.000001
  agent_keys:
    agent-tm-001: "tm-secret-key-2026"
    agent-cs-001: "cs-secret-key-2026"
    agent-ru-001: "ru-secret-key-2026"
    agent-rg-001: "rg-secret-key-2026"
